name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start Pulp services
        run: |
          docker compose -f docker/docker-compose.e2e.yml up -d
          echo "Waiting for Pulp to be healthy..."

          # Wait up to 10 minutes for Pulp to be ready
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/pulp/api/v3/status/ -u admin:admin | grep -q "200"; then
              echo "Pulp is healthy!"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 10
          done

          # Verify Pulp is responding
          curl -s http://localhost:8080/pulp/api/v3/status/ -u admin:admin | head -c 500

      - name: Run E2E tests
        run: bun run test:e2e:real
        env:
          CI: true
          SKIP_DOCKER_SETUP: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Cleanup Docker services
        if: always()
        run: docker compose -f docker/docker-compose.e2e.yml down -v
