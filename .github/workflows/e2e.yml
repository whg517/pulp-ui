name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start Pulp services
        run: |
          docker compose -f docker/docker-compose.e2e.yml up -d

          echo "Waiting for Pulp to become healthy (this may take several minutes for first run)..."
          echo "Pulp needs to run database migrations before it can serve requests."

          # Wait for the pulp container to become healthy (using Docker's health check)
          # The health check has start_period: 90s and retries: 5, so max wait is ~140s
          # But migrations can take longer, so we extend the wait
          TIMEOUT=600  # 10 minutes
          ELAPSED=0
          while [ $ELAPSED -lt $TIMEOUT ]; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' e2e-pulp-api 2>/dev/null || echo "unknown")
            echo "Pulp health status: $HEALTH (${ELAPSED}s/${TIMEOUT}s)"

            if [ "$HEALTH" = "healthy" ]; then
              echo "Pulp is healthy!"
              break
            fi

            # Show logs every 60 seconds for debugging
            if [ $((ELAPSED % 60)) -eq 0 ] && [ $ELAPSED -gt 0 ]; then
              echo "=== Pulp logs (last 10 lines) ==="
              docker logs e2e-pulp-api --tail 10 2>&1 || true
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

          # Final check
          HEALTH=$(docker inspect --format='{{.State.Health.Status}}' e2e-pulp-api 2>/dev/null || echo "unknown")
          if [ "$HEALTH" != "healthy" ]; then
            echo "Pulp failed to become healthy after ${TIMEOUT}s"
            echo "=== Container status ==="
            docker compose -f docker/docker-compose.e2e.yml ps
            echo "=== Pulp logs (last 50 lines) ==="
            docker logs e2e-pulp-api --tail 50 2>&1 || true
            exit 1
          fi

          # Extra wait to ensure Pulp is fully stable
          echo "Waiting 15 seconds for Pulp to stabilize..."
          sleep 15

          # Wait for nginx to be ready (port 8080)
          echo "Waiting for nginx (port 8080) to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/pulp/api/v3/status/ -u admin:admin > /dev/null 2>&1; then
              echo "Nginx is ready!"
              break
            fi
            echo "Waiting for nginx... ($i/30)"
            sleep 2
          done

          # Verify Pulp API is responding
          echo "Verifying Pulp API..."
          curl -s http://localhost:8080/pulp/api/v3/status/ -u admin:admin | head -c 500
          echo ""

      - name: Run E2E tests
        run: bun run test:e2e:real
        env:
          CI: true
          SKIP_DOCKER_SETUP: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Cleanup Docker services
        if: always()
        run: docker compose -f docker/docker-compose.e2e.yml down -v
