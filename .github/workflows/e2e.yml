name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Start Pulp services
        run: |
          docker compose -f docker/docker-compose.e2e.yml up -d
          echo "Waiting for Pulp to be healthy..."

          # Show container status for debugging
          docker compose -f docker/docker-compose.e2e.yml ps

          # Wait up to 10 minutes for Pulp to be ready
          # Require 3 consecutive successful health checks to ensure stability
          CONSECUTIVE_SUCCESS=0
          REQUIRED_SUCCESS=3
          for i in $(seq 1 60); do
            # Get HTTP code, handle connection failures gracefully
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 http://localhost:8080/pulp/api/v3/status/ -u admin:admin 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              CONSECUTIVE_SUCCESS=$((CONSECUTIVE_SUCCESS + 1))
              echo "Health check passed ($CONSECUTIVE_SUCCESS/$REQUIRED_SUCCESS)"
              if [ $CONSECUTIVE_SUCCESS -ge $REQUIRED_SUCCESS ]; then
                echo "Pulp is healthy and stable!"
                break
              fi
            else
              echo "Health check returned $HTTP_CODE, resetting counter"
              CONSECUTIVE_SUCCESS=0
              # Show Pulp logs if health check fails (for debugging)
              if [ $((i % 10)) -eq 0 ]; then
                echo "=== Pulp container logs (last 20 lines) ==="
                docker logs e2e-pulp-api --tail 20 2>&1 || true
                echo "=== Container status ==="
                docker compose -f docker/docker-compose.e2e.yml ps
              fi
            fi
            echo "Waiting... ($i/60)"
            sleep 10
          done

          # Final verification
          if [ $CONSECUTIVE_SUCCESS -lt $REQUIRED_SUCCESS ]; then
            echo "Pulp failed to become stable - showing logs"
            docker logs e2e-pulp-api --tail 100 2>&1 || true
            exit 1
          fi

          # Extra wait to ensure Pulp is fully initialized
          echo "Waiting 30 seconds for Pulp to fully stabilize..."
          sleep 30

          # Verify Pulp is responding
          curl -s http://localhost:8080/pulp/api/v3/status/ -u admin:admin | head -c 500

      - name: Run E2E tests
        run: bun run test:e2e:real
        env:
          CI: true
          SKIP_DOCKER_SETUP: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Cleanup Docker services
        if: always()
        run: docker compose -f docker/docker-compose.e2e.yml down -v
